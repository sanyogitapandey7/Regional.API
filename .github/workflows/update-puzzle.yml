name: Update Daily Puzzle

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 12:00 AM UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run update script
        run: |
          npm install
          node scripts/updatePuzzle.js

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/puzzles.json
          git commit -m "🤖 Daily puzzle update for $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
